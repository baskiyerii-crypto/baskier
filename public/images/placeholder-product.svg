<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F7F5F0"/>
  <!-- Subtle print studio registration / crop marks -->
  <line x1="40" y1="20" x2="40" y2="60" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="20" y1="40" x2="60" y2="40" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="760" y1="20" x2="760" y2="60" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="740" y1="40" x2="780" y2="40" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="40" y1="540" x2="40" y2="580" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="20" y1="560" x2="60" y2="560" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="760" y1="540" x2="760" y2="580" stroke="#DEDAD2" stroke-width="1.5"/>
  <line x1="740" y1="560" x2="780" y2="560" stroke="#DEDAD2" stroke-width="1.5"/>

  <!-- Centered container -->
  <g transform="translate(400, 270)">
    <!-- Layered print sheets icon -->
    <rect x="-60" y="-70" width="100" height="120" rx="8" fill="#FFFFFF" stroke="#DEDAD2" stroke-width="2"/>
    <rect x="-40" y="-50" width="100" height="120" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Color swatch dots inside sheet -->
    <circle cx="0" cy="5" r="5" fill="#182023"/>
    <circle cx="16" cy="5" r="5" fill="#C2410C"/>
    <circle cx="32" cy="5" r="5" fill="#596166"/>
    <circle cx="48" cy="5" r="5" fill="#DEDAD2"/>

    <!-- Brand Typography -->
    <text x="10" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#182023" letter-spacing="-0.02em">BASKIYERİ</text>
    <text x="10" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#596166">Görsel Hazırlanıyor</text>
  </g>
</svg>
