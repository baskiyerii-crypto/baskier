services:
  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8085}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8085}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-baskiyeri-evolution-key}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: baskiyeri
      LOG_LEVEL: ERROR
    depends_on:
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
